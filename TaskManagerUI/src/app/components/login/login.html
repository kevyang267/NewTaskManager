<!-- login.component.html -->
<div
  class="min-h-screen bg-zinc-950 flex items-center justify-center px-4"
  style="
    background-image: radial-gradient(
      ellipse 60% 50% at 50% -10%,
      rgba(200, 240, 74, 0.08) 0%,
      transparent 70%
    );
  "
>
  <div class="w-full max-w-sm bg-zinc-900 border border-zinc-800 rounded-2xl overflow-hidden">
    <!-- Header -->
    <header class="px-10 pt-10 pb-8 text-center border-b border-zinc-800">
      <div
        class="inline-flex items-center justify-center w-12 h-12 bg-lime-400 text-zinc-950 text-xl font-bold rounded-xl mb-4"
        aria-hidden="true"
      >
        ✓
      </div>

      <h1 class="text-2xl text-zinc-100 mb-1" style="font-family: 'DM Serif Display', serif">
        TaskManager
      </h1>

      <p class="text-sm text-zinc-500">
        {{ isRegistering() ? 'Create your account' : 'Sign in to continue' }}
      </p>
    </header>

    <!-- Body -->
    <section class="px-10 py-8 flex flex-col gap-5">
      <!-- Error Banner -->
      @if (errorMessage()) {
        <div
          role="alert"
          class="bg-red-950 border border-red-900 text-red-400 text-sm px-4 py-3 rounded-lg"
        >
          {{ errorMessage() }}
        </div>
      }

      <!-- Email -->
      <div class="flex flex-col gap-1.5">
        <label for="email" class="text-xs font-medium text-zinc-500 tracking-wide uppercase">
          Email
        </label>

        <input
          id="email"
          name="email"
          type="email"
          [ngModel]="email()"
          (ngModelChange)="email.set($event)"
          placeholder="you@example.com"
          autocomplete="email"
          required
          [disabled]="isLoading()"
          (keyup.enter)="submit()"
          class="bg-zinc-950 border border-zinc-800 rounded-lg px-4 py-3 text-zinc-100 text-sm placeholder-zinc-600 outline-none transition-colors focus:border-lime-400 disabled:opacity-50 disabled:cursor-not-allowed"
        />
      </div>

      <!-- Password -->
      <div class="flex flex-col gap-1.5">
        <label for="password" class="text-xs font-medium text-zinc-500 tracking-wide uppercase">
          Password
        </label>

        <input
          id="password"
          name="password"
          type="password"
          [ngModel]="password()"
          (ngModelChange)="password.set($event)"
          placeholder="••••••••"
          autocomplete="current-password"
          required
          [disabled]="isLoading()"
          (keyup.enter)="submit()"
          class="bg-zinc-950 border border-zinc-800 rounded-lg px-4 py-3 text-zinc-100 text-sm placeholder-zinc-600 outline-none transition-colors focus:border-lime-400 disabled:opacity-50 disabled:cursor-not-allowed"
        />
      </div>

      <!-- Submit Button -->
      <button
        type="button"
        (click)="submit()"
        [disabled]="isLoading()"
        [attr.aria-busy]="isLoading()"
        class="mt-1 w-full bg-lime-400 hover:bg-lime-300 active:scale-[0.98] text-zinc-950 font-semibold text-sm rounded-lg py-3 flex items-center justify-center min-h-12 transition-all disabled:opacity-60 disabled:cursor-not-allowed"
      >
        @if (isLoading()) {
          <svg
            class="animate-spin h-5 w-5 text-zinc-950"
            xmlns="http://www.w3.org/2000/svg"
            fill="none"
            viewBox="0 0 24 24"
            aria-hidden="true"
          >
            <circle
              class="opacity-25"
              cx="12"
              cy="12"
              r="10"
              stroke="currentColor"
              stroke-width="4"
            ></circle>
            <path
              class="opacity-75"
              fill="currentColor"
              d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4z"
            ></path>
          </svg>
        } @else {
          {{ isRegistering() ? 'Create Account' : 'Sign In' }}
        }
      </button>
    </section>

    <!-- Footer -->
    <footer
      class="px-10 py-5 border-t border-zinc-800 flex items-center justify-center gap-2 text-sm text-zinc-500"
    >
      <span>
        {{ isRegistering() ? 'Already have an account?' : "Don't have an account?" }}
      </span>

      <button
        type="button"
        (click)="toggleMode()"
        [disabled]="isLoading()"
        class="text-lime-400 font-semibold hover:opacity-75 transition-opacity disabled:opacity-40 disabled:cursor-not-allowed"
      >
        {{ isRegistering() ? 'Sign in' : 'Register' }}
      </button>
    </footer>
  </div>
</div>
