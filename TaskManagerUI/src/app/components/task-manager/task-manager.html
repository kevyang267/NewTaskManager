<div class="max-w-2xl mx-auto bg-white rounded-lg shadow-md p-6">
  <!-- Error message -->
  <div *ngIf="errorMessage" class="mb-4 p-3 bg-red-100 text-red-700 rounded-lg">
    {{ errorMessage }}
  </div>

  <!-- Loading indicator -->
  <div *ngIf="isLoading" class="text-center py-8">
    <div class="text-gray-500">Loading tasks...</div>
  </div>

  <!-- Task input -->
  <div class="mb-4" *ngIf="!isLoading">
    <div class="flex gap-2 mb-2">
      <input
        type="text"
        [(ngModel)]="newTaskTitle"
        (keyup.enter)="addTask()"
        placeholder="What's on your mind?"
        class="flex-1 px-4 py-2 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500"
      />
      <button
        (click)="addTask()"
        class="px-6 py-2 bg-blue-600 text-white rounded-lg hover:bg-blue-700 transition"
      >
        Create
      </button>
    </div>
    <input
      type="text"
      [(ngModel)]="newTaskDescription"
      placeholder="Add details (optional)"
      class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500"
    />
  </div>

  <!-- Task list -->
  <div class="space-y-2" *ngIf="!isLoading">
    <div
      *ngFor="let task of tasks"
      class="p-3 border border-gray-200 rounded-lg hover:bg-gray-50 transition"
    >
      <div class="flex items-start gap-3">
        <input
          type="checkbox"
          [checked]="task.isCompleted"
          (change)="toggleTask(task)"
          class="w-5 h-5 text-blue-600 rounded focus:ring-2 focus:ring-blue-500 mt-1"
        />
        <div class="flex-1">
          <div
            [class.line-through]="task.isCompleted"
            [class.text-gray-400]="task.isCompleted"
            class="font-medium"
          >
            {{ task.title }}
          </div>
          <div
            *ngIf="task.description"
            [class.text-gray-400]="task.isCompleted"
            class="text-sm text-gray-600 mt-1"
          >
            {{ task.description }}
          </div>
          <div class="text-xs text-gray-400 mt-1">
            Created: {{ task.createdAt | date: 'short' }}
          </div>
        </div>
        <button
          (click)="deleteTask(task.id)"
          class="px-3 py-1 text-red-600 hover:bg-red-50 rounded transition"
        >
          Remove
        </button>
      </div>
    </div>
  </div>

  <!-- Empty state -->
  <div *ngIf="tasks.length === 0 && !isLoading" class="text-center text-gray-400 py-8">
    Your space is zen right now 🧘‍♀️
  </div>
</div>
